
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustStreamIt -- Vidéos à la demande</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================
         HEADER SECTION
         ========================= -->
    <!-- The header contains the site logo. -->
    <header>
        <div class="header-container">
            <!-- Left column: displays the text 'LOGO' -->
            <div class="col1 logo">LOGO</div>
            <!-- Right column: displays the text 'Vidéos à la demande' -->
            <div class="col2">Vidéos à la demande</div>
        </div>
    </header>

    <!-- =========================
         BEST MOVIE SECTION
         ========================= -->
    <!-- This section displays the best-rated movie, with its image, title, description, and a details button. -->
    <section id="best-movie">
        <h2 class="best-movie-title">Meilleur film</h2>
        <div class="best-movie-container">
            <!-- Movie image (left column) -->
            <div class="col1">
                <img id="best-movie-image" src="https://picsum.photos/200/300" alt="Best Movie Placeholder">
            </div>
            <!-- Movie title (center column) -->
            <div class="col2 best-movie-title" id="best-movie-title">Titre du film</div>
            <!-- Movie description (center column) -->
            <div class="col2" id="best-movie-description">Description du film.</div>
            <!-- Details button (center column) -->
            <div class="col2">
                <button id="best-movie-details-button" class="movie-details-button">Détails</button>
            </div>
        </div>
    </section>

    <!-- =========================
         BEST RATED MOVIES SECTION
         ========================= -->
    <!-- This section will be filled dynamically by script.js with the 6 best rated movies (excluding the best movie). -->
    <section id="best-rated-movies">
    <h2 class="section-title">Films les mieux notés</h2>
    <div class="movie-list-wrapper"></div>
    </section>

    <!-- =========================
         MYSTERY CATEGORY SECTION
         ========================= -->
    <!-- This section will be filled dynamically by script.js with the 6 best Mystery movies. -->
    <section id="cat1-movies">
    <h2 class="section-title">Mystery</h2>
    <div class="movie-list-wrapper"></div>
    </section>

    <!-- =========================
         ACTION CATEGORY SECTION
         ========================= -->
    <!-- This section will be filled dynamically by script.js with the 6 best Action movies. -->
    <section id="cat2-movies">
    <h2 class="section-title">Action</h2>
    <div class="movie-list-wrapper"></div>
    </section>

    <!-- =========================
         DYNAMIC CATEGORY (AUTRES) SECTION
         ========================= -->
    <!-- This section displays the genre dropdown and the selected genre's movies. -->
    <section id="category-others">
    <h2 class="section-title">Autres:</h2>
    <div id="dropdown-menu-1"></div>
    <div class="movie-list-wrapper"></div>
        <!-- The movie list for the selected genre will be injected by script.js -->
        <div id="cat-others-movies"></div>
    </section>

    <!-- =========================
         MOVIE DETAILS MODAL
         ========================= -->
    <!-- This modal displays detailed information about a movie when the user clicks 'Détails'. -->
    <div id="movie-modal" class="modal" style="display:none;">
      <div class="modal-content">
                <!-- Modal header: contains title and close cross for mobile -->
                <div class="modal-header">
                    <!-- Movie title will be injected by script.js -->
                    <span id="modal-title"></span>
                    <!-- Close cross button, only visible on mobile -->
                    <button id="modal-close-cross" class="modal-close-cross" aria-label="Fermer">&times;</button>
                </div>
                <div id="modal-body">
                    <!-- Movie details will be injected here by script.js -->
                </div>
                <!-- Close button at the bottom center (desktop only) -->
                <button id="modal-close" class="modal-close movie-details-button" aria-label="Fermer">Fermer</button>
      </div>
    </div>

    <!-- =========================
         JAVASCRIPT INCLUSION
         ========================= -->
    <!-- The main script for dynamic rendering and interactivity. -->
    <script src="script.js"></script>
</body>
</html>
